spring.cloud.compatibility-verifier.enabled=false
spring.application.name=config-server
server.port=9101

spring.cloud.config.server.git.uri=https://github.com/aymane486/mcommerce-config-repo.git
spring.cloud.config.server.git.default-label=master
spring.cloud.config.server.git.clone-on-start=true

# Si le repo GitHub est PRIVE, decommenter et mettre ton token GitHub :
#spring.cloud.config.server.git.username=aymane486
#spring.cloud.config.server.git.password=<TON_TOKEN_GITHUB>

#Log level configuration
logging.level.root=INFO
logging.level.com.mcommerce.config.server=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
